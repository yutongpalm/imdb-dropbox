name: Fetch CEB Full
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download full CEB-IMDB (13,644 queries)
        run: |
          mkdir -p ceb && cd ceb
          wget -q -O imdb.tar.gz "https://www.dropbox.com/s/4aykbs6c8myeq2y/imdb.tar.gz?dl=1"
          wget -q -O imdb_data.json "https://www.dropbox.com/s/o8m1fthow6zn1kg/imdb-unique-plans-sqls.tar.gz?dl=1"
          ls -lh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ceb-imdb-full
          path: ceb/